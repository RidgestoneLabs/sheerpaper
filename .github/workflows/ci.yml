name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Xcode checks for the generated pmh_parser.c before the build step that
      # makes it, so it has to exist up front.
      - name: Generate the highlighting parser
        run: make -C Dependency/peg-markdown-highlight

      - name: Install pods
        run: pod install

      - name: Install style generator packages
        working-directory: Tools/GitHub-style-generator
        run: npm ci

      - name: Test
        run: >-
          xcodebuild -workspace Sheerpaper.xcworkspace -scheme Sheerpaper
          -configuration Debug -derivedDataPath build/DD
          CODE_SIGNING_ALLOWED=NO test
